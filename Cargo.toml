[package]
name = "sea-orm-ext"
version = "0.0.4"
edition = "2021"
rust-version = "1.81"
description = "SeaORM non-invasive extension: auto-fill, soft-delete, multi-tenant, with Summer plugin support"
license = "MIT"
repository = "https://github.com/tttq/sea-orm-ext"
keywords = ["sea-orm", "orm", "multi-tenant", "soft-delete", "auto-fill"]
categories = ["database"]

[features]
default = ["sea-orm/runtime-tokio-native-tls"]

# === Database drivers ===
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite"]
sqlx-all = ["sea-orm/sqlx-all"]              # 一次性启用 mysql + postgres + sqlite

# === TLS / Runtime ===
rustls = ["runtime-tokio-rustls"]
runtime-tokio-native-tls = ["sea-orm/runtime-tokio-native-tls"]
runtime-tokio-rustls = ["sea-orm/runtime-tokio-rustls"]
runtime-async-std-native-tls = ["sea-orm/runtime-async-std-native-tls"]
runtime-async-std-rustls = ["sea-orm/runtime-async-std-rustls"]

# === Streaming ===
stream = ["sea-orm/stream"]                  # 流式查询（sea-orm 默认开启）

# === sea-orm type support ===
with-json = ["sea-orm/with-json"]
with-chrono = ["sea-orm/with-chrono"]
with-rust_decimal = ["sea-orm/with-rust_decimal"]
with-uuid = ["sea-orm/with-uuid"]
with-time = ["sea-orm/with-time"]
with-bigdecimal = ["sea-orm/with-bigdecimal"]
with-ipnetwork = ["sea-orm/with-ipnetwork"]
with-mac_address = ["sea-orm/with-mac_address"]
with-arrow = ["sea-orm/with-arrow"]

# === sea-orm PostgreSQL extensions ===
postgres-array = ["sea-orm/postgres-array"]
postgres-use-serial-pk = ["sea-orm/postgres-use-serial-pk"]
postgres-vector = ["sea-orm/postgres-vector"]
json-array = ["sea-orm/json-array"]

# === sea-orm SQLite extensions ===
sqlite-use-returning-for-3_35 = ["sea-orm/sqlite-use-returning-for-3_35"]
sqlite-no-row-value-before-3_15 = ["sea-orm/sqlite-no-row-value-before-3_15"]

# === sea-orm MariaDB extensions ===
mariadb-use-returning = ["sea-orm/mariadb-use-returning"]

# === sea-orm other features ===
debug-print = ["sea-orm/debug-print"]
proxy = ["sea-orm/proxy"]
rbac = ["sea-orm/rbac"]
schema-sync = ["sea-orm/schema-sync"]
seaography = ["sea-orm/seaography"]
tracing-spans = ["sea-orm/tracing-spans"]
entity-registry = ["sea-orm/entity-registry"]

# === Summer framework ===
summer = ["dep:summer"]
summer-web = ["dep:summer-web", "dep:tower", "summer"]

# === summer-web feature passthrough ===
http2 = ["summer-web", "summer-web?/http2"]
multipart = ["summer-web", "summer-web?/multipart"]
openapi = ["summer-web", "summer-web?/openapi"]
openapi-redoc = ["summer-web", "summer-web?/openapi-redoc"]
openapi-scalar = ["summer-web", "summer-web?/openapi-scalar"]
openapi-swagger = ["summer-web", "summer-web?/openapi-swagger"]
socket-io = ["summer-web", "summer-web?/socket_io"]
ws = ["summer-web", "summer-web?/ws"]

# === Convenience aliases ===
summer-web-openapi = ["openapi"]
with-web = ["summer-web"]
with-web-openapi = ["openapi"]

# === Runtime ===
runtime-tokio = ["dep:tokio"]

# === Full feature set ===
full = ["summer", "summer-web", "runtime-tokio"]

[dependencies]
sea-orm = { version = "2.0.0", features = ["macros", "mock"] }
sea-query = "1.0.1"
sea-orm-ext-macros = { version = "0.0.4", path = "sea-orm-ext-macros" }

async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
uuid = { version = "1", features = ["v4"] }
schemars="1.1"
anyhow = "1"
dashmap = "6"
summer = { version = "0.7.1", optional = true }
summer-web = { version = "0.7.1", optional = true }
tower = { version = "0.5", optional = true }

tokio = { version = "1", optional = true, features = [
    "sync", "macros", "rt", "rt-multi-thread", "time",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.0", features = ["macros", "mock", "runtime-tokio-rustls", "sqlx-sqlite"] }
tracing-subscriber = "0.3"
tracing = "0.1"
serial_test = "2"

[[example]]
name = "sea-orm-tenant-example"
path = "examples/sea-orm-tenant-example.rs"
required-features = ["full"]

[[test]]
name = "crud_tests"
path = "tests/crud_tests.rs"
required-features = ["runtime-tokio"]

[[test]]
name = "macro_tests"
path = "tests/macro_tests.rs"
required-features = ["runtime-tokio"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["runtime-tokio"]

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"
required-features = ["runtime-tokio"]
